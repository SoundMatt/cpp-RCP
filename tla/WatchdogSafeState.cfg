\* TLC model-checking configuration for WatchdogSafeState.tla.
\* SafestateEnabled = TRUE exercises the affirmative latch behavior
\* (rx_wd_safestate_enable set); flip to FALSE separately to exercise
\* NoLatchWithoutEnable non-vacuously. BoundedClock keeps the otherwise
\* infinite Nat-valued clock state space finite for TLC.
CONSTANT
    TimeoutInterval = 3
    SafestateEnabled = TRUE

INIT Init
NEXT Next

INVARIANT TypeOK
PROPERTY LatchIsSticky
CONSTRAINT BoundedClock
