\* TLC model-checking configuration for CrcSafeStateLatch.tla.
\* EnforceLatch = TRUE exercises the affirmative latch behavior (rx_enforce_e2e
\* set); flip to FALSE separately to exercise NoLatchWithoutEnforce non-vacuously.
CONSTANT
    EnforceLatch = TRUE

INIT Init2
NEXT Next

INVARIANT TypeOK
PROPERTY LatchIsSticky
\* NoLatchWithoutEnforce is a tautology under EnforceLatch = TRUE (the
\* hypothesis ~EnforceLatch is vacuously false); check it non-vacuously by
\* re-running with EnforceLatch = FALSE in this file instead.
